name: Greenfield Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "greenfield/**"
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: HyoDo quality gate
        uses: lofibrainwav/HyoDo/.github/actions/hyodo@v4.19.3
        with:
          python-version: "3.12"
          args: "--strict-tests --audience engineer"

      - name: Verify HyoDo version
        run: hyodo --version

      - name: HyoDo safety scan
        run: hyodo safe --strict --audience engineer

  hyodo-current-source-shadow:
    name: HyoDo current source shadow
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      HYODO_CURRENT_SHA: b5a984fc758ff7826422047f263fe4f5b0c988bc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install HyoDo current source line
        run: python -m pip install "git+https://github.com/lofibrainwav/HyoDo.git@${HYODO_CURRENT_SHA}"

      - name: Verify HyoDo source identity
        run: hyodo --version

      - name: Shadow quality check
        run: hyodo check --strict-tests --audience engineer

      - name: Shadow safety scan
        run: hyodo safe --strict --audience engineer
