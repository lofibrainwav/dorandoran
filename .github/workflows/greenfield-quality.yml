name: Greenfield Quality

on:
  pull_request:
  push:
    branches:
      - "greenfield/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: HyoDo quality gate
        uses: lofibrainwav/HyoDo/.github/actions/hyodo@v4.14.0
        with:
          python-version: "3.12"
          args: "--strict-tests --audience engineer"

      - name: HyoDo safety scan
        run: hyodo safe --strict --audience engineer

  hyodo-415-shadow:
    name: HyoDo 4.15 source shadow
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      HYODO_415_SHA: 6e0e25a413b30580280051d609a439b1547a24a0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install HyoDo 4.15 source line
        run: python -m pip install "git+https://github.com/lofibrainwav/HyoDo.git@${HYODO_415_SHA}"

      - name: Shadow quality check
        run: hyodo check --strict-tests --audience engineer

      - name: Shadow safety scan
        run: hyodo safe --strict --audience engineer
